# Production Environment Properties
spring.datasource.driverClassName=org.postgresql.Driver

# Use Render's DATABASE_URL environment variable directly (recommended).
# Render auto-creates this when you link a PostgreSQL service to your web service.
# Format provided by Render: postgresql://user:password@host:port/dbname
# Spring Boot needs the jdbc: prefix, so we apply it via the SPRING_DATASOURCE_URL env var below.
# On Render dashboard: set SPRING_DATASOURCE_URL = jdbc:postgresql://...?sslmode=require
#                      set SPRING_DATASOURCE_USERNAME = <your db user>
#                      set SPRING_DATASOURCE_PASSWORD = <your db password>
#
# Alternatively, if you still want individual vars, set:
#   DB_HOST to the EXTERNAL hostname (e.g. dpg-xxxx.oregon-postgres.render.com)
#   DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD as before.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Disable the H2 Console for security in production
spring.h2.console.enabled=false
