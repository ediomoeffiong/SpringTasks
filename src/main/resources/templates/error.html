<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Error | SpringTasks</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="row min-vh-75 align-items-center justify-content-center text-center py-5">
            <div class="col-lg-6 col-md-8">
                <div class="card p-5 border-0 shadow-lg text-center">
                    <div class="mb-4">
                        <i class="bi bi-exclamation-triangle-fill text-warning display-1"></i>
                    </div>
                    <h2 class="fw-bold mb-3 text-primary-theme">Something Went Wrong</h2>
                    <p class="text-muted-theme mb-4 fs-5" th:text="${errorMessage ?: 'An unexpected error occurred while processing your request.'}">
                        An unexpected error occurred.
                    </p>
                    <div class="d-flex justify-content-center gap-3 flex-wrap">
                        <a th:href="@{/}" class="btn btn-outline-secondary px-4 py-2 rounded-pill fw-semibold">
                            <i class="bi bi-house-door me-2"></i>Home
                        </a>
                        <a th:href="@{/dashboard}" class="btn btn-primary px-4 py-2 rounded-pill fw-semibold shadow-sm">
                            <i class="bi bi-grid-1x2-fill me-2"></i>Go to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
