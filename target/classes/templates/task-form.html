<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title th:text="${task.id == null ? 'Add Task' : 'Edit Task'}">Task Form</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="row justify-content-center py-4">
            <div class="col-md-9 col-lg-7">
                <div class="card p-4 p-lg-5 shadow-lg border-0 transition-all">
                    <div class="mb-4">
                        <a th:href="@{/tasks}" class="text-decoration-none text-muted-theme small mb-3 d-inline-block">
                            <i class="bi bi-arrow-left me-1"></i>Back to Tasks
                        </a>
                        <h2 class="fw-bold mt-2 text-primary-theme" th:text="${task.id == null ? 'Create New Task' : 'Update Task Details'}">New Task</h2>
                        <p class="text-muted-theme"
                            th:text="${task.id == null ? 'Define your next objective clearly.' : 'Modify the details of your task.'}">
                            Task details</p>
                    </div>

                    <form th:action="@{/tasks}" th:object="${task}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{completed}">

                        <div class="mb-4">
                            <label for="title" class="form-label fw-bold">Task Title <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{title}"
                                class="form-control form-control-lg bg-light border-0 px-4 py-3" id="title"
                                placeholder="E.g. Prepare Q4 presentation..." th:errorclass="is-invalid">
                            <div class="invalid-feedback fw-medium" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                                Title error
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label fw-bold">Description</label>
                            <textarea th:field="*{description}" class="form-control bg-light border-0 px-4 py-3"
                                id="description" rows="5" placeholder="Add some context..."></textarea>
                        </div>
                        
                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label for="dueDate" class="form-label fw-bold">Due Date (Optional)</label>
                                <input type="datetime-local" th:field="*{dueDate}" class="form-control bg-light border-0 px-4 py-3" id="dueDate">
                            </div>
                            <div class="col-md-6">
                                <label for="priority" class="form-label fw-bold">Priority</label>
                                <select th:field="*{priority}" class="form-select bg-light border-0 px-4 py-3" id="priority">
                                    <option value="LOW">Low</option>
                                    <option value="MEDIUM">Medium</option>
                                    <option value="HIGH">High</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-grid gap-3 mt-5 d-md-flex justify-content-md-end">
                            <a th:href="@{/tasks}" class="btn btn-light px-5 py-3 fw-bold text-muted">Cancel</a>
                            <button type="submit" class="btn btn-primary px-5 py-3 shadow-sm fw-bold">
                                <i class="bi bi-save me-2"></i>
                                <span th:text="${task.id == null ? 'Create Task' : 'Save Changes'}">Save</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
