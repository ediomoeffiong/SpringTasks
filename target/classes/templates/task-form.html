<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title th:text="${task.id == null ? 'Add Task' : 'Edit Task'}">Task Form</title>
    <style>
        .form-glass-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .form-floating > .form-control:focus, 
        .form-floating > .form-control:not(:placeholder-shown) {
            padding-top: 1.625rem;
            padding-bottom: 0.625rem;
        }

        .input-group-text-custom {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-muted);
            border-radius: 1rem 0 0 1rem !important;
        }

        .form-control-custom {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid var(--card-border) !important;
            color: var(--text-main) !important;
            border-radius: 1rem !important;
            padding: 0.75rem 1.25rem;
            transition: all 0.3s ease;
        }

        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.1) !important;
            border-color: var(--primary-color) !important;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .form-label-custom {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        [data-theme='dark'] .form-control-custom {
            background: rgba(0, 0, 0, 0.2) !important;
        }

        .btn-modern {
            border-radius: 1rem;
            padding: 0.8rem 2rem;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-modern:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        [data-theme='dark'] .form-control-custom[type="datetime-local"] {
            color-scheme: dark;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <div class="row justify-content-center py-5">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="form-glass-card p-4 p-lg-5">
                    <div class="mb-5">
                        <a th:href="@{/tasks}" class="text-decoration-none text-muted-theme small mb-4 d-inline-flex align-items-center gap-2 hover-opacity">
                            <i class="bi bi-arrow-left-circle fs-5"></i> Back to Workspace
                        </a>
                        <div class="d-flex align-items-center gap-3 mt-2">
                            <div class="bg-primary bg-opacity-10 p-3 rounded-4">
                                <i class="bi bi-pencil-square text-primary fs-3" th:if="${task.id != null}"></i>
                                <i class="bi bi-plus-circle text-primary fs-3" th:if="${task.id == null}"></i>
                            </div>
                            <div>
                                <h2 class="fw-bold mb-1 text-primary-theme" th:text="${task.id == null ? 'Create New Task' : 'Update Task Details'}">New Task</h2>
                                <p class="text-muted-theme mb-0"
                                    th:text="${task.id == null ? 'Define your next objective clearly.' : 'Modify the details of your task.'}">
                                    Task details</p>
                            </div>
                        </div>
                    </div>

                    <form th:action="@{/tasks}" th:object="${task}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{completed}">

                        <div class="mb-4">
                            <label for="title" class="form-label-custom">
                                <i class="bi bi-type-h1 text-primary"></i> Task Title <span class="text-danger">*</span>
                            </label>
                            <input type="text" th:field="*{title}"
                                class="form-control form-control-custom form-control-lg" id="title"
                                placeholder="E.g. Prepare Q4 presentation..." th:errorclass="is-invalid" required>
                            <div class="invalid-feedback fw-medium" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                                Title error
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label-custom">
                                <i class="bi bi-justify-left text-primary"></i> Description
                            </label>
                            <textarea th:field="*{description}" class="form-control form-control-custom"
                                id="description" rows="4" placeholder="Add some context..."></textarea>
                        </div>
                        
                        <div class="row g-4 mb-4">
                            <!-- Category Section -->
                            <div class="col-md-6">
                                <label for="category" class="form-label-custom">
                                    <i class="bi bi-tag text-primary"></i> Category
                                </label>
                                <select th:field="*{categoryId}" class="form-select form-control-custom" id="category">
                                    <option value="" class="text-dark">No Category</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" 
                                            th:selected="${cat.id == task.categoryId}" class="text-dark"></option>
                                </select>
                            </div>
                            
                            <!-- Priority -->
                            <div class="col-md-6">
                                <label for="priority" class="form-label-custom">
                                    <i class="bi bi-flag text-primary"></i> Priority
                                </label>
                                <select th:field="*{priority}" class="form-select form-control-custom" id="priority">
                                    <option value="LOW" class="text-dark">Low</option>
                                    <option value="MEDIUM" class="text-dark">Medium</option>
                                    <option value="HIGH" class="text-dark">High</option>
                                </select>
                            </div>
                        </div>

                        <!-- Date Row -->
                        <div class="row g-4 mb-4">
                            <div class="col-12">
                                <label for="dueDate" class="form-label-custom">
                                    <i class="bi bi-calendar-event text-primary"></i> Due Date (Optional)
                                </label>
                                <input type="datetime-local" th:field="*{dueDate}" 
                                       class="form-control form-control-custom" id="dueDate">
                            </div>
                        </div>

                        <div class="d-grid gap-3 mt-5 d-md-flex justify-content-md-end pt-4 border-top" style="border-color: var(--card-border) !important;">
                            <a th:href="@{/tasks}" class="btn btn-outline-secondary btn-modern px-5">Cancel</a>
                            <button type="submit" class="btn btn-primary btn-modern px-5 shadow-sm">
                                <i class="bi bi-save2 me-2"></i>
                                <span th:text="${task.id == null ? 'Create Task' : 'Save Changes'}">Save</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
