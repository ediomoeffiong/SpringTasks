<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$LAYOUT_TITLE | $CONTENT_TITLE">SpringTasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #6366f1;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --bg-body: #f8fafc;
            --text-main: #1a1a1a;
            --text-muted: #6b7280;
            --card-border: rgba(0,0,0,0.05);
        }

        [data-theme='dark'] {
            --primary-color: #6366f1;
            --secondary-color: #818cf8;
            --bg-glass: rgba(30, 41, 59, 0.85);
            --bg-body: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-border: rgba(255,255,255,0.05);
        }

        /* Essential Typography */
        .text-primary-theme { color: var(--text-main) !important; }
        .text-muted-theme { color: var(--text-muted) !important; }
        
        h1, h2, h3, h4, h5, h6 {
            font-weight: 600 !important;
            color: var(--text-main);
        }

        body {
            background-color: var(--bg-body);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }

        .card {
            border: 1px solid var(--card-border);
            border-radius: 1.25rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            background: var(--bg-glass);
            backdrop-filter: blur(8px);
            transition: transform 0.2s, background-color 0.3s, border-color 0.3s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 0.75rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .task-done {
            text-decoration: line-through;
            color: #64748b;
        }

        .glass-container {
            padding: 2rem 0;
        }

        /* Prevent layout shift during auth page loading */
        [layout\:fragment="content"] {
            min-height: 70vh;
        }

        /* App Wrapper & Sidebar */
        .app-wrapper {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .sidebar {
            width: 260px;
            background-color: #0b1220;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 1040;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar-header {
            padding: 1.5rem;
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sidebar-header i {
            color: var(--primary-color);
        }

        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }

        .sidebar-menu::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-menu::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .sidebar-section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            padding: 0.5rem 1rem;
            margin-top: 1rem;
            margin-bottom: 0.25rem;
            font-weight: 700;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
            transform: translateX(4px);
        }

        .sidebar-link.active {
            color: #ffffff;
            background-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            font-weight: 600;
        }
        
        .sidebar-link.active:hover {
            transform: none;
        }

        .sidebar-link i {
            font-size: 1.1rem;
            width: 1.25rem;
            text-align: center;
            transition: color 0.2s;
        }

        .sidebar-link:hover i {
            color: var(--primary-color);
        }

        .sidebar-link.active i {
            color: #ffffff;
        }

        .sidebar-footer {
            padding: 1rem 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logout-link:hover i {
            color: #ef4444;
        }

        .main-content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-width: 0;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Auth Layout (Sidebar active) */
        .auth-layout .main-content-wrapper {
            margin-left: 260px;
        }

        .mobile-header {
            display: none !important;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 18, 32, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1035;
            display: none;
            opacity: 0;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-overlay.show {
            display: block;
            opacity: 1;
        }

        @media (max-width: 991.98px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.show {
                transform: translateX(0);
            }
            .auth-layout .main-content-wrapper {
                margin-left: 0;
            }
            .mobile-header {
                display: flex !important;
                align-items: center;
                padding: 1rem;
                background: var(--bg-glass);
                backdrop-filter: blur(10px);
                border-bottom: 1px solid rgba(255, 255, 255, 0.3);
                position: sticky;
                top: 0;
                z-index: 1030;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            }
            .mobile-header-btn {
                background: transparent;
                border: none;
                font-size: 1.5rem;
                color: #1e293b;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: color 0.2s;
                padding: 0;
            }
            .mobile-header-btn:hover {
                color: var(--primary-color);
            }
        }

        /* Floating Theme Toggle */
        #themeToggleContainer {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 2000;
            transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s ease;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
        }

        #themeToggleContainer.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        #themeToggle {
            width: 3.5rem;
            height: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            background: var(--bg-glass) !important;
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border) !important;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #themeToggle:hover {
            transform: scale(1.1) rotate(15deg);
            background: var(--primary-color) !important;
            color: #ffffff;
            border-color: transparent !important;
        }
    </style>
</head>

<body>

    <div th:class="${#authorization.expression('isAuthenticated()') and currentUri != '/'} ? 'app-wrapper auth-layout' : 'app-wrapper non-auth-layout'">
        <!-- AUTH SIDEBAR FRAGMENT -->
        <th:block sec:authorize="isAuthenticated()" th:if="${currentUri != '/'}">
            <div th:replace="~{fragments/sidebar :: sidebar(currentUri=${currentUri})}"></div>
        </th:block>

        <div class="main-content-wrapper w-100">
            <!-- MOBILE HEADER ONLY FOR AUTH -->
            <th:block sec:authorize="isAuthenticated()" th:if="${currentUri != '/'}">
                <header class="mobile-header d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2" style="color: var(--primary-color); font-weight: 800; font-size: 1.25rem; letter-spacing: -0.025em;">
                        <i class="bi bi-layers-fill"></i> SpringTasks
                    </div>
                    <button class="mobile-header-btn" id="sidebarToggle" aria-label="Toggle Sidebar">
                        <i class="bi bi-list"></i>
                    </button>
                </header>
            </th:block>

            <!-- NON-AUTH HEADER (LANDING PAGE) -->
            <th:block th:if="${!#authorization.expression('isAuthenticated()') or currentUri == '/'}">
                <nav class="navbar navbar-expand-lg px-lg-5 px-3 py-3" style="background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 1030; position: sticky; top: 0;">
                    <div class="container-fluid">
                        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}" style="color: var(--primary-color); font-weight: 800; font-size: 1.25rem; letter-spacing: -0.025em;">
                            <i class="bi bi-layers-fill"></i> SpringTasks
                        </a>
                        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nonAuthNav" aria-controls="nonAuthNav" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="nonAuthNav">
                            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center gap-3">
                                <li class="nav-item">
                                    <a class="nav-link fw-bold px-0" style="color: #475569;" th:href="@{/login}">Login</a>
                                </li>
                                <li class="nav-item">
                                    <a class="btn btn-primary fw-bold text-white px-4 rounded-pill shadow-sm" th:href="@{/signup}">Sign Up free</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>
            </th:block>

            <main class="container glass-container" th:classappend="${#authorization.expression('isAuthenticated()') and currentUri != '/'} ? 'px-lg-5 container-fluid' : ''">
                <div layout:fragment="content">
                    <!-- Page content goes here -->
                </div>
            </main>

            <footer class="py-4 mt-auto">
            </footer>
        </div>
    </div>
    
    <!-- Floating Theme Toggle Container -->
    <div id="themeToggleContainer">
        <button class="btn rounded-circle" id="themeToggle" title="Toggle Dark/Light Mode">
            <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
        </button>
    </div>
    
    <!-- Render Toasts -->
    <div th:replace="~{fragments/toasts :: toasts}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Sidebar Toggle
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('appSidebar');
            const overlay = document.getElementById('sidebarOverlay');

            if (sidebarToggle && sidebar && overlay) {
                sidebarToggle.addEventListener('click', function() {
                    sidebar.classList.add('show');
                    overlay.classList.add('show');
                });

                overlay.addEventListener('click', function() {
                    sidebar.classList.remove('show');
                    overlay.classList.remove('show');
                });
            }

            // Theme Toggle
            const themeToggleBtn = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const currentTheme = localStorage.getItem('theme') ? localStorage.getItem('theme') : null;

            if (currentTheme) {
                document.documentElement.setAttribute('data-theme', currentTheme);
                if (currentTheme === 'dark') {
                    themeIcon.classList.replace('bi-moon-stars-fill', 'bi-sun-fill');
                }
            }

            if (themeToggleBtn) {
                const themeContainer = document.getElementById('themeToggleContainer');
                let fadeTimeout;

                const showToggle = () => {
                    themeContainer.classList.add('visible');
                    clearTimeout(fadeTimeout);
                    fadeTimeout = setTimeout(() => {
                        themeContainer.classList.remove('visible');
                    }, 5000);
                };

                // Show on scroll
                window.addEventListener('scroll', showToggle, { passive: true });

                themeToggleBtn.addEventListener('click', async function() {
                    let theme = document.documentElement.getAttribute('data-theme');
                    const newTheme = theme === 'dark' ? 'light' : 'dark';
                    
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                    themeIcon.classList.replace(theme === 'dark' ? 'bi-sun-fill' : 'bi-moon-stars-fill', 
                                              newTheme === 'dark' ? 'bi-sun-fill' : 'bi-moon-stars-fill');
                    
                    try {
                        await fetch('/api/user/theme', {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ themePreference: newTheme })
                        });
                    } catch(e) { console.error('Failed to sync theme to backend', e); }
                    
                    showToggle(); // Keep visible when interacted with
                });
            }

            // Initialize Toasts
            var toastElList = [].slice.call(document.querySelectorAll('.toast'))
            var toastList = toastElList.map(function(toastEl) {
                return new bootstrap.Toast(toastEl, {autohide: true, delay: 5000})
            });
            toastList.forEach(toast => toast.show());
        });
    </script>
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
