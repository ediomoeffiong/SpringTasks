<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Task Dashboard</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="row align-items-center mb-5">
            <div class="col-md-5">
                <h2 class="fw-bold mb-1">Your Tasks</h2>
                <p class="text-muted-theme mb-0">Manage and track your progress</p>
            </div>
            <div class="col-md-7 d-flex justify-content-md-end gap-3 flex-wrap mt-3 mt-md-0">
                <!-- Search Bar -->
                <form class="d-flex" method="get" th:action="@{/tasks}">
                    <input th:if="${activeStatus != 'all'}" type="hidden" name="status" th:value="${activeStatus}" />
                    <div class="input-group shadow-sm">
                        <input type="text" class="form-control border-end-0 border" name="search" placeholder="Search tasks..." aria-label="Search" th:value="${searchQuery}">
                        <button class="btn btn-white border border-start-0 bg-white text-muted" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
                
                <!-- Filter Pills -->
                <div class="btn-group shadow-sm">
                    <a th:href="@{/tasks(search=${searchQuery})}" class="btn border px-4"
                        th:classappend="${activeStatus == 'all' ? 'active btn-primary text-white border-0' : 'btn-light text-dark'}">All</a>
                    <a th:href="@{/tasks(status='pending', search=${searchQuery})}" class="btn border px-4"
                        th:classappend="${activeStatus == 'pending' ? 'active btn-primary text-white border-0' : 'btn-light text-dark'}">Pending</a>
                    <a th:href="@{/tasks(status='completed', search=${searchQuery})}" class="btn border px-4"
                        th:classappend="${activeStatus == 'completed' ? 'active btn-primary text-white border-0' : 'btn-light text-dark'}">Completed</a>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${tasks.empty}" class="text-center py-5">
            <div class="mb-4">
                <i class="bi bi-clipboard-x display-1 text-muted-theme opacity-50"></i>
            </div>
            <h4 class="text-muted-theme fw-semibold">No tasks found</h4>
            <p class="text-muted-theme">Ready to get started? Create your first task!</p>
            <a href="javascript:void(0)" onclick="openCreateModal()" class="btn btn-primary mt-3 px-4 py-2 fw-semibold shadow-sm"><i class="bi bi-plus-lg me-2"></i> Add New Task</a>
        </div>

        <!-- Task List utilizing Fragment -->
        <div class="task-list-container" th:if="${!tasks.empty}" style="max-width: 900px; margin: 0 auto;">
            <div th:each="task : ${tasks}">
                <div th:replace="~{fragments/task-card :: task-card(task=${task})}"></div>
            </div>
        </div>
    </div>
</body>

</html>
