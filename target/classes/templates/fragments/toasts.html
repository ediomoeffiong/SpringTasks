<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Toast Container -->
    <th:block th:fragment="toasts">
        <div class="toast-container position-fixed bottom-0 end-0 p-4" style="z-index: 1060">
            <!-- Success Toast -->
            <div th:if="${successMessage}" class="toast align-items-center text-bg-success border-0 show" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4000">
                <div class="d-flex">
                    <div class="toast-body d-flex align-items-center gap-2 fw-medium">
                        <i class="bi bi-check-circle-fill fs-5"></i>
                        <span th:text="${successMessage}"></span>
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
            
            <!-- Error Toast -->
            <div th:if="${errorMessage}" class="toast align-items-center text-bg-danger border-0 show" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
                <div class="d-flex">
                    <div class="toast-body d-flex align-items-center gap-2 fw-medium">
                        <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
