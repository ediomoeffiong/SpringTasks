<html xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="task-card(task)">
        <div class="card mb-3 task-card border-0 shadow-sm transition-all" th:classappend="${task.completed ? 'opacity-75' : ''}">
            <div class="card-body p-4">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <div class="d-flex align-items-center gap-3">
                        <form th:action="@{/tasks/toggle/{id}(id=${task.id})}" method="post" class="m-0 ajax-toggle-form">
                            <button type="submit" class="btn btn-link p-0 text-decoration-none border-0 bg-transparent">
                                <i class="fs-4 bi" 
                                   th:classappend="${task.completed ? 'text-success bi-check-circle-fill' : 'text-muted bi-circle'}"
                                   style="transition: all 0.2s;"></i>
                            </button>
                        </form>
                        <h5 class="card-title mb-0 fw-bold" th:classappend="${task.completed ? 'text-muted text-decoration-line-through' : 'text-dark'}" th:text="${task.title}">Task Title</h5>
                        <span th:if="${task.category}" class="badge rounded-pill ms-2" 
                              th:style="'background-color: ' + (${task.category.color} ?: '#94a3b8') + '; color: white;'" 
                              th:text="${task.category.name}">Category</span>
                        <span th:if="${task.category == null}" class="badge rounded-pill ms-2" 
                              style="background-color: #94a3b8; color: white;">Uncategorized</span>
                    </div>
                    <div>
                        <span class="badge rounded-pill px-3 py-2 fw-semibold" th:classappend="${task.completed ? 'text-bg-success bg-opacity-10 text-success' : 'text-bg-warning bg-opacity-10 text-warning'}">
                            <i class="bi" th:classappend="${task.completed ? 'bi-check2' : 'bi-clock-history'}"></i>
                            <span th:text="${task.completed ? 'Completed' : 'Pending'}"></span>
                        </span>
                    </div>
                </div>
                
                <p class="card-text text-secondary ms-5 mb-3" th:if="${task.description}" th:classappend="${task.completed ? 'text-decoration-line-through text-muted' : ''}" th:text="${task.description}">Task Description</p>
                
                <div class="d-flex align-items-center justify-content-between ms-5 mt-3 pt-3 border-top border-light">
                    <div class="text-muted small d-flex gap-3">
                        <span title="Created"><i class="bi bi-calendar-plus me-1"></i> <span th:text="${#temporals.format(task.createdAt, 'MMM dd, yyyy')}"></span></span>
                        <span th:if="${task.dueDate}" title="Due" th:classappend="${task.dueDate.isBefore(#temporals.createNow()) and !task.completed ? 'text-danger fw-bold' : ''}">
                            <i class="bi bi-calendar-x me-1"></i> <span th:text="${#temporals.format(task.dueDate, 'MMM dd, yyyy')}"></span>
                        </span>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <a th:href="@{/tasks/edit/{id}(id=${task.id})}" class="btn btn-sm btn-light border-0 text-primary rounded-3 px-3">
                            <i class="bi bi-pencil-square me-1"></i> Edit
                        </a>
                        <!-- Hard Delete with Confirmation -->
                        <form th:action="@{/tasks/delete/{id}(id=${task.id})}" method="post" class="m-0" onsubmit="return confirm('Are you sure you want to delete this task? This action cannot be undone.');">
                            <button type="submit" class="btn btn-sm btn-light border-0 text-danger rounded-3 px-3 delete-task-btn">
                                <i class="bi bi-trash3 me-1"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
