# Production Environment Properties
spring.datasource.driverClassName=org.postgresql.Driver

# Use Render's DATABASE_URL environment variable if provided, or fallback to individual variables.
# Note: If provided, make sure DATABASE_URL starts with jdbc:postgresql://
# Alternatively, use DB_HOST, DB_NAME, DB_PORT, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Disable the H2 Console for security in production
spring.h2.console.enabled=false
